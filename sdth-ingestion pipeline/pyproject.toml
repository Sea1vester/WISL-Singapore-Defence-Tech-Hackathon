[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wisl-ingest"
version = "0.1.0"
description = "WISL data ingestion pipeline: parses raw drone flight logs and feeds them into the normalisation module"
requires-python = ">=3.11"
dependencies = [
    "pyulog>=1.0",
    "pymavlink>=2.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
wisl-ingest = "wisl_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
