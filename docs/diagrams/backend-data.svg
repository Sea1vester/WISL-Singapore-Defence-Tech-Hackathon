<g class="map-node" aria-label="Stage 3: Standardise. Python and JSON Schema." transform="translate(472 172)"><rect width="184" height="174" rx="12" fill="#f8fcfb" class="face"/><rect x="16" y="16" width="32" height="32" rx="8" fill="#d5eae2"/><path d="M24 24h16v17H24ZM28 28h8m-8 5 3 3 6-7" class="map-icon" style="color:#4b806d"/><text x="163" y="36" text-anchor="end" class="map-step">03</text><text x="16" y="75" class="map-title">Standardise</text><text x="16" y="99" class="map-body">L1 → validated L2 JSON</text><text x="16" y="118" class="map-body">One telemetry contract</text><rect x="16" y="135" width="152" height="24" rx="5" fill="#e1efe9"/><text x="92" y="151" text-anchor="middle" class="map-tech">Python · JSON Schema</text></g>
<g class="map-node" aria-label="Stage 4: Detect. Deterministic Python rules." transform="translate(688 172)"><rect width="184" height="174" rx="12" fill="#f9fcf5" class="face"/><rect x="16" y="16" width="32" height="32" rx="8" fill="#e2ebce"/><path d="M22 34h5l4-9 5 15 4-7h4" class="map-icon" style="color:#748650"/><text x="163" y="36" text-anchor="end" class="map-step">04</text><text x="16" y="75" class="map-title">Detect</text><text x="16" y="99" class="map-body">Rules → incident evidence</text><text x="16" y="118" class="map-body">Group recurring signatures</text><rect x="16" y="135" width="152" height="24" rx="5" fill="#eaf0df"/><text x="92" y="151" text-anchor="middle" class="map-tech">Deterministic Python</text></g>
