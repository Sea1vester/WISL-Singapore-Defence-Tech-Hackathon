<g class="map-node" aria-label="Stage 1: Receive. FastAPI and SHA-256." transform="translate(40 172)"><rect width="184" height="174" rx="12" fill="#fffdf7" class="face"/><rect x="16" y="16" width="32" height="32" rx="8" fill="#f6e4b9"/><path d="M25 35v6h15v-6M32.5 22v12m-5-5 5 5 5-5" class="map-icon" style="color:#937238"/><text x="163" y="36" text-anchor="end" class="map-step">01</text><text x="16" y="75" class="map-title">Receive</text><text x="16" y="99" class="map-body">Check &amp; fingerprint</text><text x="16" y="118" class="map-body">Same bytes, same identity</text><rect x="16" y="135" width="152" height="24" rx="5" fill="#f8eed6"/><text x="92" y="151" text-anchor="middle" class="map-tech">FastAPI · SHA-256</text></g>
