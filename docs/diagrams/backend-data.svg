<rect width="1120" height="574" fill="#fcfcf9"/>
<rect x="20" y="96" width="872" height="282" rx="17" fill="#f0f4f3" stroke="#dce5df"/>
<text x="872" y="123" text-anchor="end" class="map-eyebrow">LOCAL BACKEND / Python · FastAPI · Uvicorn</text>
<text x="1008" y="151" text-anchor="middle" class="map-eyebrow">OPERATOR WORKSPACE</text>
