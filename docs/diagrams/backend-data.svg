<svg id="backend-map" xmlns="http://www.w3.org/2000/svg" width="1120" height="574" viewBox="0 0 1120 574" role="img" aria-labelledby="map-title map-desc">
<title id="map-title">WISL backend data architecture</title><desc id="map-desc">Recorded logs enter FastAPI, Python parsers produce L1 JSON, canonical projection validates L2 JSON, deterministic rules index incidents, and the review workspace reads evidence. SQLite and original files preserve data. Optional local model analysis is separate from the main pipeline. Select any labelled module for details.</desc>
<style>
#backend-map text{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;fill:#203d41}#backend-map .map-node{cursor:pointer;outline:none}#backend-map .face{stroke:#d7e1db;stroke-width:1.2}#backend-map .map-node:hover .face,#backend-map .map-node:focus-visible .face{stroke:#648575;stroke-width:2.5}#backend-map .map-node[aria-pressed="true"] .face{stroke:#285d50;stroke-width:2.5}#backend-map .map-node:focus-visible .face{stroke:#c3693d;stroke-dasharray:5 3}#backend-map .map-eyebrow{font-size:10px;letter-spacing:1.1px;font-weight:650;fill:#667b77}#backend-map .map-title{font-size:21px;font-weight:650;letter-spacing:-.65px}#backend-map .map-body{font-size:12px;fill:#58716b}#backend-map .map-tech{font-size:11px;font-weight:600}#backend-map .map-step{font-size:11px;font-weight:650;fill:#82938c}#backend-map .map-wire{fill:none;stroke:#a0b2a8;stroke-width:1.5}#backend-map .map-dashed{stroke:#aa94b6;stroke-dasharray:5 4}#backend-map .map-icon{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}#backend-map .map-hint{font-size:10px;fill:#7c8c84}
</style>
