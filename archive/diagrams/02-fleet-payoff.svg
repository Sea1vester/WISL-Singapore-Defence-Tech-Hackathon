<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A recorded incident feeds two paths: on this one flight it becomes a 3D replay and a plain-English report; once its signature recurs across two or more flights, it becomes a fleet-wide mitigation bulletin.">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2937; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 1.5; }
    .box-single { fill: #ffffff; stroke: #128c84; stroke-width: 2; }
    .box-fleet { fill: #fdece9; stroke: #bc2a30; stroke-width: 2; }
    .title { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 11px; fill: #5c6a74; text-anchor: middle; }
    .edge-label { font-size: 11px; fill: #5c6a74; text-anchor: middle; }
    .lane { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; fill: #5c6a74; text-anchor: middle; text-transform: uppercase; }
    path.conn { stroke: #1f2937; stroke-width: 1.5; fill: none; marker-end: url(#arrow2); }
  </style>

  <!-- Source incident -->
  <rect class="box" x="370" y="20" width="160" height="55" rx="4"/>
  <text class="title" x="450" y="43">Incident recorded</text>
  <text class="sub" x="450" y="58">signature = type + detector</text>

  <!-- split -->
  <path d="M 400 75 C 300 120, 200 130, 150 165" class="conn"/>
  <path d="M 500 75 C 620 120, 720 130, 760 165" class="conn"/>

  <text class="edge-label" x="230" y="115">this flight</text>
  <text class="edge-label" x="660" y="115">signature recurs &#8805; 2 flights</text>

  <!-- Left lane: single flight -->
  <text class="lane" x="150" y="150">Single flight</text>
  <rect class="box-single" x="60" y="165" width="180" height="55" rx="4"/>
  <text class="title" x="150" y="188">/v1/flights/{id}/path</text>
  <text class="sub" x="150" y="203">WGS84 samples</text>

  <path d="M150 220 L150 260" class="conn"/>
  <rect class="box-single" x="60" y="260" width="180" height="60" rx="4"/>
  <text class="title" x="150" y="284">3D replay + report</text>
  <text class="sub" x="150" y="300">CesiumJS · plain-English</text>

  <!-- Right lane: fleet -->
  <text class="lane" x="760" y="150">Fleet-wide</text>
  <rect class="box-fleet" x="670" y="165" width="180" height="55" rx="4"/>
  <text class="title" x="760" y="188">/v1/incidents/patterns</text>
  <text class="sub" x="760" y="203">flight_count, first/last seen</text>

  <path d="M760 220 L760 260" class="conn"/>
  <rect class="box-fleet" x="670" y="260" width="180" height="60" rx="4"/>
  <text class="title" x="760" y="284">Mitigation bulletin</text>
  <text class="sub" x="760" y="300">affected flights, what to check</text>

  <text class="sub" x="760" y="340" font-style="italic">not a firmware push or command channel</text>
</svg>
