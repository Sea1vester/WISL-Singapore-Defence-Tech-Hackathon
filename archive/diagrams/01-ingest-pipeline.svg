<svg viewBox="0 0 1120 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A raw log file moves from the controller through an edge uploader, the platform API, a Redis queue, and a worker, which parses it into one canonical schema and then both stores it and runs physics-threshold detectors against it.">
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2937; }
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 1.5; }
    .box-accent { fill: #e6f4f2; stroke: #128c84; stroke-width: 2; }
    .title { font-size: 13px; font-weight: 600; text-anchor: middle; }
    .sub { font-size: 11px; fill: #5c6a74; text-anchor: middle; }
    .edge-label { font-size: 11px; fill: #5c6a74; text-anchor: middle; }
    line, path.conn { stroke: #1f2937; stroke-width: 1.5; fill: none; marker-end: url(#arrow1); }
  </style>

  <!-- Row 1: main chain -->
  <!-- col1 Controller -->
  <rect class="box" x="20" y="60" width="150" height="60" rx="4"/>
  <text class="title" x="95" y="85">Controller</text>
  <text class="sub" x="95" y="102">raw log file</text>

  <!-- col2 Edge uploader -->
  <rect class="box" x="220" y="60" width="150" height="60" rx="4"/>
  <text class="title" x="295" y="85">Edge uploader</text>
  <text class="sub" x="295" y="102">SHA-256 + manifest</text>

  <!-- col3 Platform API -->
  <rect class="box" x="420" y="60" width="150" height="60" rx="4"/>
  <text class="title" x="495" y="85">Platform API</text>
  <text class="sub" x="495" y="102">/v1/logs/upload</text>

  <!-- col4 Redis queue -->
  <rect class="box" x="620" y="60" width="150" height="60" rx="4"/>
  <text class="title" x="695" y="85">Redis queue</text>
  <text class="sub" x="695" y="102">raw_uploads</text>

  <!-- col5 Worker -->
  <rect class="box" x="820" y="60" width="120" height="60" rx="4"/>
  <text class="title" x="880" y="95">Worker</text>

  <!-- Arrows row 1 -->
  <line x1="170" y1="90" x2="218" y2="90" class="conn"/>
  <text class="edge-label" x="194" y="78">hash + watch</text>

  <line x1="370" y1="90" x2="418" y2="90" class="conn"/>
  <text class="edge-label" x="394" y="78">POST multipart</text>

  <line x1="570" y1="90" x2="618" y2="90" class="conn"/>
  <text class="edge-label" x="594" y="78">enqueue</text>

  <line x1="770" y1="90" x2="818" y2="90" class="conn"/>
  <text class="edge-label" x="794" y="78">pop</text>

  <!-- down from worker to canonical schema -->
  <line x1="880" y1="120" x2="880" y2="170" class="conn"/>
  <text class="edge-label" x="945" y="148">parse (format registry)</text>

  <!-- Row 2: canonical schema, centered under worker -->
  <rect class="box-accent" x="770" y="170" width="230" height="60" rx="4"/>
  <text class="title" x="885" y="195">Canonical L2 JSON</text>
  <text class="sub" x="885" y="212">position · attitude · battery · sensors</text>

  <!-- branch to SQLite and detectors -->
  <line x1="820" y1="230" x2="700" y2="270" class="conn"/>
  <text class="edge-label" x="720" y="255">store</text>

  <line x1="950" y1="230" x2="1050" y2="270" class="conn"/>
  <text class="edge-label" x="1015" y="255">threshold check</text>

  <rect class="box" x="560" y="270" width="140" height="55" rx="4"/>
  <text class="title" x="630" y="298">SQLite</text>
  <text class="sub" x="630" y="313">canonical_records</text>

  <rect class="box-accent" x="960" y="270" width="150" height="55" rx="4"/>
  <text class="title" x="1035" y="293">Rule-based</text>
  <text class="sub" x="1035" y="308">detectors (physics)</text>
</svg>
