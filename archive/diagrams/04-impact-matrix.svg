<svg viewBox="0 0 720 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A 2 by 2 matrix of fleet economics against failure pattern. WISL targets the quadrant where cheap, large COTS fleets have systematic, fleet-wide failure modes; low-stakes one-off losses on the same cheap fleet are explicitly out of scope for forensics.">
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2937; }
    .quad { stroke: #1f2937; stroke-width: 1.5; }
    .q-target { fill: #e6f4f2; stroke: #128c84; stroke-width: 2.5; }
    .q-other { fill: #ffffff; }
    .qtitle { font-size: 14px; font-weight: 700; text-anchor: middle; }
    .qsub { font-size: 11.5px; fill: #5c6a74; text-anchor: middle; }
    .axis { font-size: 12px; font-weight: 600; fill: #5c6a74; text-anchor: middle; }
    .axis-arrow { stroke: #9aa3a9; stroke-width: 1.5; marker-end: url(#arrow4); }
  </style>
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3a9"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="70" y1="480" x2="670" y2="480" class="axis-arrow"/>
  <line x1="70" y1="480" x2="70" y2="60" class="axis-arrow"/>
  <text class="axis" x="370" y="520">failure pattern &#8594;</text>
  <text class="axis" x="130" y="500">one-off</text>
  <text class="axis" x="610" y="500">systematic, fleet-wide</text>
  <text class="axis" x="30" y="450" transform="rotate(-90 30 450)">fleet economics &#8594;</text>
  <text class="axis" x="115" y="455">expensive, small fleet</text>
  <text class="axis" x="115" y="90">cheap, large COTS fleet</text>

  <!-- quadrants -->
  <!-- bottom-left: cheap fleet, one-off -->
  <rect class="quad q-other" x="70" y="270" width="270" height="210"/>
  <text class="qtitle" x="205" y="355">Expected losses</text>
  <text class="qsub" x="205" y="375">one FPV/DIY unit down — jammed,</text>
  <text class="qsub" x="205" y="390">crashed, flat battery — not worth forensics</text>

  <!-- bottom-right: cheap fleet, systematic (target) -->
  <rect class="quad q-target" x="340" y="270" width="330" height="210"/>
  <text class="qtitle" x="505" y="350" fill="#0d5f59">WISL's target</text>
  <text class="qsub" x="505" y="372" fill="#1f2937">DJI &#183; PX4/Auterion &#183; ArduPilot</text>
  <text class="qsub" x="505" y="390" fill="#1f2937">batch defect, firmware bug,</text>
  <text class="qsub" x="505" y="405" fill="#1f2937">common jamming vulnerability</text>
  <text class="qsub" x="505" y="425" fill="#0d5f59" font-style="italic">caught once, fixed across hundreds of cheap units</text>

  <!-- top-left: expensive fleet, one-off -->
  <rect class="quad q-other" x="70" y="60" width="270" height="210"/>
  <text class="qtitle" x="205" y="150">Diagnosable</text>
  <text class="qsub" x="205" y="170">worth investigating,</text>
  <text class="qsub" x="205" y="185">lower fleet-wide leverage</text>

  <!-- top-right: expensive fleet, systematic -->
  <rect class="quad q-other" x="340" y="60" width="330" height="210"/>
  <text class="qtitle" x="505" y="150">Rare in practice</text>
  <text class="qsub" x="505" y="170">high stakes per airframe,</text>
  <text class="qsub" x="505" y="185">but a handful of named platforms —</text>
  <text class="qsub" x="505" y="200">not where fleet volume lives</text>
</svg>
